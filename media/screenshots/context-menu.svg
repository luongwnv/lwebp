<svg xmlns="http://www.w3.org/2000/svg" width="580" height="780" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
  <!-- Drop shadow -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
  </filter>
  <!-- Menu bg -->
  <rect x="20" y="20" width="540" height="740" rx="8" fill="white" filter="url(#shadow)" stroke="#d0d0d0" stroke-width="0.5"/>

  <!-- Menu items -->
  <!-- Open to the Side -->
  <text x="40" y="56" font-size="13" fill="#1a1a1a">Open to the Side</text>
  <text x="540" y="56" text-anchor="end" font-size="11" fill="#888">⌃ ↵</text>
  <!-- Open With... -->
  <text x="40" y="82" font-size="13" fill="#1a1a1a">Open With...</text>

  <line x1="30" y1="94" x2="550" y2="94" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Reveal in Finder -->
  <text x="40" y="116" font-size="13" fill="#1a1a1a">Reveal in Finder</text>
  <text x="540" y="116" text-anchor="end" font-size="11" fill="#888">⌥⌘R</text>
  <!-- Open in Integrated Terminal -->
  <text x="40" y="142" font-size="13" fill="#1a1a1a">Open in Integrated Terminal</text>

  <line x1="30" y1="154" x2="550" y2="154" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Maven submenu -->
  <text x="40" y="176" font-size="13" fill="#1a1a1a">Maven</text>
  <text x="540" y="176" text-anchor="end" font-size="12" fill="#888">›</text>

  <line x1="30" y1="188" x2="550" y2="188" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Select for Compare -->
  <text x="40" y="210" font-size="13" fill="#1a1a1a">Select for Compare</text>

  <line x1="30" y1="222" x2="550" y2="222" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Open Timeline -->
  <text x="40" y="244" font-size="13" fill="#1a1a1a">Open Timeline</text>

  <line x1="30" y1="256" x2="550" y2="256" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Add File to Chat -->
  <text x="40" y="278" font-size="13" fill="#1a1a1a">Add File to Chat</text>

  <line x1="30" y1="290" x2="550" y2="290" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Cut -->
  <text x="40" y="312" font-size="13" fill="#1a1a1a">Cut</text>
  <text x="540" y="312" text-anchor="end" font-size="11" fill="#888">⌘X</text>
  <!-- Copy -->
  <text x="40" y="338" font-size="13" fill="#1a1a1a">Copy</text>
  <text x="540" y="338" text-anchor="end" font-size="11" fill="#888">⌘C</text>

  <line x1="30" y1="350" x2="550" y2="350" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Copy Path -->
  <text x="40" y="372" font-size="13" fill="#1a1a1a">Copy Path</text>
  <text x="540" y="372" text-anchor="end" font-size="11" fill="#888">⌥⌘C</text>
  <!-- Copy Relative Path -->
  <text x="40" y="398" font-size="13" fill="#1a1a1a">Copy Relative Path</text>
  <text x="540" y="398" text-anchor="end" font-size="11" fill="#888">⌥⇧⌘C</text>

  <line x1="30" y1="410" x2="550" y2="410" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Run Tests -->
  <text x="40" y="432" font-size="13" fill="#1a1a1a">Run Tests</text>
  <!-- Debug Tests -->
  <text x="40" y="458" font-size="13" fill="#1a1a1a">Debug Tests</text>
  <!-- Run Tests with Coverage -->
  <text x="40" y="484" font-size="13" fill="#1a1a1a">Run Tests with Coverage</text>

  <line x1="30" y1="496" x2="550" y2="496" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Convert to WebP (highlighted as lwebp commands) -->
  <text x="40" y="518" font-size="13" fill="#1a1a1a">Convert to WebP</text>
  <text x="40" y="544" font-size="13" fill="#1a1a1a">Convert to WebP (Select Quality...)</text>

  <line x1="30" y1="556" x2="550" y2="556" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Rename -->
  <text x="40" y="578" font-size="13" fill="#1a1a1a">Rename...</text>
  <text x="540" y="578" text-anchor="end" font-size="11" fill="#888">↵</text>
  <!-- Delete -->
  <text x="40" y="604" font-size="13" fill="#1a1a1a">Delete</text>
  <text x="540" y="604" text-anchor="end" font-size="12" fill="#888">⌘⌫</text>

  <line x1="30" y1="616" x2="550" y2="616" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Git -->
  <text x="40" y="638" font-size="13" fill="#1a1a1a">Git: View File History</text>
  <text x="540" y="638" text-anchor="end" font-size="11" fill="#888">⌥H</text>
</svg>