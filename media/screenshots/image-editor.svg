<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="750" fill="#ffffff"/>

  <!-- Header -->
  <text x="30" y="30" fill="#333" font-size="15" font-weight="700">IMG_7390.JPG</text>
  <text x="870" y="30" text-anchor="end" fill="#888" font-size="13">960 × 960 · JPEG · 32.2 KB</text>

  <!-- Image preview area -->
  <rect x="30" y="50" width="840" height="400" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Abstract image mockup -->
  <rect x="310" y="90" width="280" height="320" fill="#555"/>
  <rect x="310" y="90" width="140" height="60" fill="#444"/>
  <rect x="450" y="90" width="70" height="60" fill="#888"/>
  <rect x="520" y="90" width="70" height="60" fill="#666"/>
  <rect x="310" y="150" width="100" height="100" fill="#333"/>
  <rect x="410" y="150" width="180" height="100" fill="#ddd"/>
  <rect x="310" y="250" width="100" height="80" fill="#bbb"/>
  <rect x="410" y="250" width="180" height="80" fill="#555"/>
  <!-- Small squares on left -->
  <rect x="220" y="220" width="60" height="50" fill="#777"/>
  <rect x="220" y="340" width="60" height="50" fill="#777"/>
  <!-- Triangle/lightning shape -->
  <polygon points="460,290 510,350 420,380" fill="#eee"/>

  <!-- Bottom panels row -->
  <!-- IMAGE INFO box -->
  <rect x="30" y="475" width="415" height="110" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="500" fill="#333" font-size="12" font-weight="700" letter-spacing="0.5">IMAGE INFO</text>
  <text x="50" y="526" fill="#666" font-size="12">Dimensions</text>
  <text x="180" y="526" fill="#333" font-size="12">960 × 960</text>
  <text x="50" y="548" fill="#666" font-size="12">Format</text>
  <text x="180" y="548" fill="#333" font-size="12">JPEG</text>
  <text x="50" y="570" fill="#666" font-size="12">File Size</text>
  <text x="180" y="570" fill="#333" font-size="12">32.2 KB</text>

  <!-- EXIF DATA box -->
  <rect x="465" y="475" width="405" height="110" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="485" y="500" fill="#333" font-size="12" font-weight="700" letter-spacing="0.5">EXIF DATA</text>
  <text x="485" y="526" fill="#666" font-size="12">Orientation</text>
  <text x="830" y="526" text-anchor="end" fill="#333" font-size="12">1</text>
  <text x="485" y="548" fill="#666" font-size="12">Color Space</text>
  <text x="830" y="548" text-anchor="end" fill="#333" font-size="12">srgb</text>

  <!-- CONVERT section -->
  <rect x="30" y="605" width="840" height="120" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="632" fill="#333" font-size="12" font-weight="700" letter-spacing="0.5">CONVERT</text>

  <!-- Format dropdown -->
  <text x="50" y="660" fill="#666" font-size="11" font-weight="600">Format</text>
  <rect x="50" y="668" width="90" height="30" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  <text x="62" y="688" fill="#333" font-size="12">WebP</text>
  <text x="128" y="688" text-anchor="end" fill="#999" font-size="11">▾</text>

  <!-- Quality slider -->
  <text x="170" y="660" fill="#666" font-size="11" font-weight="600">Quality</text>
  <rect x="170" y="676" width="140" height="5" rx="2.5" fill="#e0e0e0"/>
  <rect x="170" y="676" width="112" height="5" rx="2.5" fill="#2563eb"/>
  <circle cx="282" cy="678.5" r="7" fill="#2563eb"/>
  <text x="325" y="688" fill="#333" font-size="13" font-weight="600">80</text>

  <!-- Convert button -->
  <rect x="370" y="666" width="100" height="36" rx="4" fill="#4ade80"/>
  <text x="420" y="690" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Convert</text>

  <!-- Estimated size -->
  <text x="50" y="714" fill="#666" font-size="12">Estimated: </text>
  <text x="118" y="714" fill="#333" font-size="12" font-weight="700">3.4 KB</text>
  <text x="162" y="714" fill="#22c55e" font-size="12" font-weight="600"> (89% smaller)</text>
</svg>