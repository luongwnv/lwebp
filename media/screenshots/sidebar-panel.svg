<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
  <!-- Window bg -->
  <rect width="680" height="820" fill="#f0f0f0" rx="12"/>
  <!-- Title bar -->
  <rect width="680" height="38" fill="#e0e0e0" rx="12"/>
  <rect y="26" width="680" height="12" fill="#e0e0e0"/>
  <circle cx="20" cy="19" r="6.5" fill="#FF5F57"/>
  <circle cx="40" cy="19" r="6.5" fill="#FEBC2E"/>
  <circle cx="60" cy="19" r="6.5" fill="#28C840"/>
  <text x="340" y="24" text-anchor="middle" font-size="12" fill="#3a3a3a">LWEBP - WEBP CONVERTER: CONVERT TO WE...</text>

  <!-- Activity bar -->
  <rect x="0" y="38" width="48" height="782" fill="#2d2d2e"/>

  <!-- Explorer icon -->
  <g opacity="0.55" transform="translate(12,56)">
    <path d="M3 0 L15 0 L24 9 L24 26 L3 26 Z" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M15 0 L15 9 L24 9" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Source control icon -->
  <g opacity="0.55" transform="translate(12,104)">
    <circle cx="5" cy="5" r="4" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="19" cy="21" r="4" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M5 9 C5 16 12 17 16 17 L19 17" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Search icon -->
  <g opacity="0.55" transform="translate(12,152)">
