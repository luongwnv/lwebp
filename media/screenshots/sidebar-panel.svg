    <path d="M0 12 L12 18 L24 12" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 17 L12 23 L24 17" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Content area -->
  <rect x="48" y="38" width="632" height="782" fill="white"/>
  <!-- Panel header -->
  <rect x="48" y="38" width="632" height="34" fill="#f0f0f0"/>
  <text x="62" y="60" font-size="11" fill="#666" letter-spacing="0.3">LWEBP - WEBP CONVERTER: CONVERT TO WE...</text>

  <!-- SELECT IMAGES -->
  <text x="62" y="108" font-size="11.5" fill="#111" font-weight="700" letter-spacing="1.2">SELECT IMAGES</text>

  <!-- Select Files button -->
  <rect x="62" y="118" width="283" height="38" rx="5" fill="#e5e5e5"/>
  <text x="203" y="142" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Select Files</text>

  <!-- Select Folder button -->
  <rect x="357" y="118" width="283" height="38" rx="5" fill="#e5e5e5"/>
  <text x="498" y="142" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Select Folder</text>

  <!-- No files selected box -->
  <rect x="62" y="166" width="578" height="64" rx="5" fill="white" stroke="#e2e2e2" stroke-width="1"/>
  <text x="351" y="203" text-anchor="middle" font-size="13.5" fill="#aaa" font-style="italic">No files selected</text>

  <!-- SETTINGS -->
  <text x="62" y="258" font-size="11.5" fill="#111" font-weight="700" letter-spacing="1.2">SETTINGS</text>

  <!-- Output Format -->
  <text x="62" y="290" font-size="13.5" fill="#1a1a1a" font-weight="600">Output Format</text>
  <rect x="62" y="300" width="578" height="40" rx="5" fill="white" stroke="#c5c5c5" stroke-width="1"/>
  <text x="82" y="326" font-size="13.5" fill="#1a1a1a">WebP</text>
  <path d="M622 316 L634 316 L628 326 Z" fill="#777"/>

  <!-- Quality -->
  <text x="62" y="366" font-size="13.5" fill="#1a1a1a" font-weight="600">Quality</text>
  <!-- Slider bg -->
  <rect x="62" y="379" width="568" height="6" rx="3" fill="#ddd"/>
  <!-- Slider filled (80%) -->
  <rect x="62" y="379" width="409" height="6" rx="3" fill="#1a73e8"/>
  <!-- Slider thumb -->
  <circle cx="471" cy="382" r="11" fill="#1a73e8"/>
  <!-- Value -->
  <text x="658" y="388" text-anchor="middle" font-size="13.5" fill="#1a1a1a">80</text>

  <!-- Checkbox -->
  <rect x="62" y="410" width="16" height="16" rx="3" fill="white" stroke="#aaa" stroke-width="1.5"/>
  <text x="88" y="424" font-size="13.5" fill="#1a1a1a">Delete original after conversion</text>

  <!-- Convert button -->
  <rect x="62" y="444" width="578" height="50" rx="8" fill="#86efac"/>
  <text x="351" y="475" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="500">Convert to WebP</text>
</svg>