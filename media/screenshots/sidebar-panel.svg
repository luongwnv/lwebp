    <line x1="15.5" y1="15.5" x2="24" y2="24" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Extensions icon -->
  <g opacity="0.55" transform="translate(12,200)">
    <path d="M0 6 L6 0 L12 6 L6 12 Z" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M12 6 L18 0 L24 6 L18 12 Z" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M6 12 L12 18 L18 12" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- lwebp (active) -->
  <rect x="0" y="242" width="3" height="36" fill="#7c3aed"/>
  <g transform="translate(12,246)">
    <path d="M5 3 L5 19 L21 19" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Python icon -->
  <g opacity="0.55" transform="translate(15,296)">
    <path d="M9 0 C4 0 0 4 0 9 L0 13 L9 13 L9 11 L7 11 L7 9 L18 9 L18 4 C18 2 16 0 14 0 Z" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M9 18 C14 18 18 14 18 9 L18 5 L9 5 L9 7 L11 7 L11 9 L0 9 L0 14 C0 16 2 18 4 18 Z" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Debug icon -->
  <g opacity="0.55" transform="translate(12,346)">
    <circle cx="12" cy="10" r="7" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="3" y1="9" x2="9" y2="9" stroke="white" stroke-width="1.5"/>
    <line x1="15" y1="9" x2="21" y2="9" stroke="white" stroke-width="1.5"/>
    <line x1="3" y1="14" x2="9" y2="16" stroke="white" stroke-width="1.5"/>
    <line x1="15" y1="16" x2="21" y2="14" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="23" r="4" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="12" y1="17" x2="12" y2="19" stroke="white" stroke-width="1.5"/>
